<!DOCTYPE html>

<head>

    <title>Reycreate Photography</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

            <div class="gallery">

                <div class="photo">
                    <img src="images/photo1.jpg" alt="Photography">

                <div class="photo">
                    <img src="images/photo2.jpg" alt="Photography">

                <div class="photo">

                </div>

            </div>

        </section>

    </main>


    <footer>
        <p>© 2026 Reycreate Photography</p>
    </footer>

</html>
